name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set app version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0-ci.${{ github.run_number }}"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish Windows app
        run: >
          dotnet publish src/EqSync.App/EqSync.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish/EqSync-win-x64
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          /p:Version=${{ env.APP_VERSION }}
          /p:InformationalVersion=${{ env.APP_VERSION }}

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          Compress-Archive -Path artifacts/publish/EqSync-win-x64/* -DestinationPath artifacts/package/EqSync-win-x64.zip -Force

      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: EqSync-win-x64
          path: artifacts/package/EqSync-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/package/EqSync-win-x64.zip
          generate_release_notes: true
